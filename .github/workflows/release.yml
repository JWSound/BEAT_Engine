name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated release tag (for example v0.1.2)
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          success=$(gh run list --workflow ci.yml --commit "$commit" --status success --json conclusion --jq 'length')
          test "$success" -gt 0
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Stable version required"
          assert os.environ["RELEASE_TAG"] == "v" + version
          PY
      - run: python -m pip install build
      - run: python -m build
      - name: Publish stable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --latest --notes-file "docs/releases/${RELEASE_TAG#v}.md"
