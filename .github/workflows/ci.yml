name: CI
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/beat_engine/*.py src/beat_engine/beat_contract tests
      - run: python -m pytest
      - run: python -m beat_engine instantiate --backend cpu
      - run: julia --threads=2 --startup-file=no --project=src/beat_engine/julia_local src/beat_engine/julia_local/tests/runtests.jl
      - run: julia --threads=2 --startup-file=no --project=src/beat_engine/julia_local src/beat_engine/julia_local/tests/reference_tests.jl
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: beat-engine-${{ matrix.os }}
          path: dist/*

  # The Metal backend, as far as a runner without a GPU can take it.
  #
  # GitHub's macOS runners are Apple Silicon but virtualized under Apple's
  # Virtualization Framework, which exposes no GPU, so Metal.functional() is
  # false and no kernel runs here. What this job does cover is the part that
  # breaks silently otherwise: instantiating julia_metal resolves Metal.jl and
  # precompiles BeatEngineMetalBundle, which compiles every BeatEngineMetal*.jl
  # source, and metal_host_tests.jl then checks the entry points the solver
  # dispatches to and the environment controls that select kernel and
  # write-back modes.
  #
  # Kernel correctness needs a self-hosted Apple Silicon runner; that belongs
  # in hardware.yml alongside cuda and rocm, not here.
  metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: python -m pip install -e .
      - run: python -m beat_engine instantiate --backend metal
      - run: julia --threads=2 --startup-file=no --project=src/beat_engine/julia_metal src/beat_engine/julia_local/tests/metal_host_tests.jl

  # Solve-speed benchmark gate (step 1 of the performance plan).
  #
  # One repeatable command -- scripts/benchmark_sweep.jl -- records the actual
  # sweep workload's per-stage times and per-frequency correctness anchors, and
  # scripts/compare_solve_speed.py diffs that machine-readable JSON against the
  # committed baseline under results/baseline_sweep_cpu.json.
  #
  # Wall-clock time is only comparable on a stable host, so this job gates
  # *correctness drift and completion* (the sweep must run end to end with
  # finite, correct results), not speed: the accuracy tolerance is loose enough
  # to absorb cross-runner BLAS noise but tight enough to flag a numeric change.
  # The tight time threshold is applied on the self-hosted accelerator runner
  # (hardware.yml) and on developers' own machines, where the host is stable.
  sweep-benchmark:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - run: python -m pip install -e .
      - run: python -m beat_engine instantiate --backend cpu
      - run: julia --threads=2 --startup-file=no --project=src/beat_engine/julia_local src/beat_engine/julia_local/scripts/benchmark_sweep.jl --steps 8 --min-freq 100 --max-freq 20000 --eval-points 74 --warmups 0 --repetitions 1 --json results/ci_sweep.json
      - run: python scripts/compare_solve_speed.py --baseline src/beat_engine/julia_local/results/baseline_sweep_cpu.json --results results/ci_sweep.json --accuracy-tolerance 1e-3
